<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Book stack icon -->
  <rect x="8" y="14" width="26" height="34" rx="3" fill="#2A9D8F" opacity="0.9"/>
  <rect x="8" y="14" width="4" height="34" rx="2" fill="#1d7068"/>
  <rect x="14" y="20" width="14" height="1.5" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="14" y="24" width="10" height="1.5" rx="1" fill="rgba(255,255,255,0.35)"/>
  <rect x="14" y="28" width="12" height="1.5" rx="1" fill="rgba(255,255,255,0.35)"/>

  <!-- Second book (offset, behind) -->
  <rect x="18" y="10" width="22" height="32" rx="3" fill="#457B9D" opacity="0.7"/>
  <rect x="18" y="10" width="4" height="32" rx="2" fill="#2d5470"/>

  <!-- Glow dot -->
  <circle cx="37" cy="12" r="4" fill="#E63946" opacity="0.85"/>
  <circle cx="37" cy="12" r="6" fill="#E63946" opacity="0.2"/>

  <!-- Wordmark -->
  <text x="52" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#f0ece4" letter-spacing="0.5">Academic</text>
  <text x="52" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="400" fill="#2A9D8F" letter-spacing="4">PLANNER</text>

  <!-- Subtle line separator -->
  <line x1="52" y1="34" x2="222" y2="34" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
</svg>
